name: nightly-server-image

# Unsigned internal build of the sync server from this repository. It is not a
# release: no tag, no GitHub release, no signing key. The image is published to
# GHCR for the team to run the current develop.
#
# Package visibility: GHCR inherits a package's visibility from the repository
# that first publishes it. This repository is public, so the first publish
# creates the package public; the maintainer flips it private immediately after
# that first run. Subsequent publishes from this repository keep the package
# private. Do not treat the package as private until the visibility check in
# the runbook has been repeated.

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly-server-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the source clock
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=image,rewrite-timestamp=true
          tags: |
            ghcr.io/myne-md/myne-server-nightly:nightly
            ghcr.io/myne-md/myne-server-nightly:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
